<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recall — мои заметки</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a12;
      --surface: rgba(17, 21, 35, 0.84);
      --surface-strong: #121728;
      --surface-soft: #171d31;
      --line: rgba(169, 181, 219, 0.13);
      --line-strong: rgba(169, 181, 219, 0.22);
      --text: #f2f4ff;
      --muted: #8992ad;
      --muted-strong: #abb3cb;
      --violet: #9a83ff;
      --violet-bright: #b5a5ff;
      --cyan: #65d9ed;
      --pink: #f08bc8;
      --danger: #ff7e91;
      --radius-xl: 26px;
      --radius-lg: 19px;
      --radius-md: 13px;
      --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 8% 4%, rgba(105, 75, 214, .20), transparent 34%),
        radial-gradient(ellipse at 92% 18%, rgba(37, 155, 184, .12), transparent 30%),
        radial-gradient(ellipse at 50% 100%, rgba(111, 72, 171, .12), transparent 36%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      letter-spacing: .005em;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
      opacity: .16;
      background-image: linear-gradient(rgba(154, 131, 255, .08) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(154, 131, 255, .08) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    ::selection { color: #fff; background: rgba(139, 112, 255, .45); }

    .container {
      width: min(1320px, calc(100% - 56px));
      margin: 48px auto 88px;
    }

    header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      margin-bottom: 30px;
      padding: 12px 0 26px;
      border-bottom: 1px solid var(--line);
    }

    .account-tools { position: absolute; top: 12px; right: 0; }
    .logout-button {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 9px 15px; border: 1px solid var(--line-strong); border-radius: 12px;
      color: var(--muted-strong); text-decoration: none; font-size: 13px;
      background: rgba(18, 22, 38, .62); transition: .2s ease;
    }
    .logout-button:hover { color: var(--text); border-color: var(--violet); background: rgba(154,131,255,.12); }

    header::before {
      content: "PERSONAL KNOWLEDGE SPACE  /  01";
      color: var(--cyan);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .22em;
    }

    header::after {
      position: absolute;
      top: 21px;
      right: 0;
      content: "●  PRIVATE WORKSPACE";
      padding: 8px 12px;
      border: 1px solid rgba(101, 217, 237, .2);
      border-radius: 999px;
      color: #9adce8;
      background: rgba(33, 107, 123, .12);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .13em;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 66px);
      font-weight: 780;
      line-height: 1.02;
      letter-spacing: -.075em;
      background: linear-gradient(105deg, #fff 8%, #d8d0ff 48%, #75dced 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h2 {
      margin: 0 0 18px;
      color: #f0f1ff;
      font-size: 21px;
      font-weight: 680;
      letter-spacing: -.035em;
    }

    h3 { color: #f0f1ff; letter-spacing: -.025em; }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    header .muted { font-size: 15px; color: #a5acc5; }

    .panel, .note, .tags-panel, .graph-panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(22, 27, 45, .94), rgba(13, 17, 29, .94));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .035);
      backdrop-filter: blur(18px);
    }

    .panel {
      margin-bottom: 24px;
      padding: clamp(22px, 3vw, 34px);
    }

    /* Form */
    #form-heading::before {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 10px 2px 0;
      border-radius: 50%;
      content: "";
      background: var(--violet);
      box-shadow: 0 0 14px rgba(154, 131, 255, .9);
    }

    label {
      display: block;
      margin: 13px 0 7px;
      color: #b8c0d9;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    input, textarea, select {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0 0 14px;
      padding: 13px 15px;
      border: 1px solid rgba(162, 173, 210, .16);
      border-radius: var(--radius-md);
      outline: none;
      color: var(--text);
      background: rgba(7, 10, 19, .64);
      font: inherit;
      font-size: 14px;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease, transform .2s ease;
    }

    input::placeholder, textarea::placeholder { color: #626d88; }

    input:focus, textarea:focus, select:focus {
      border-color: rgba(154, 131, 255, .72);
      background: rgba(13, 16, 29, .96);
      box-shadow: 0 0 0 4px rgba(129, 105, 240, .12), 0 0 26px rgba(129, 105, 240, .08);
    }

    textarea { min-height: 145px; resize: vertical; }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid rgba(166, 177, 215, .18);
      border-radius: 12px;
      color: #dce1f4;
      background: linear-gradient(180deg, rgba(39, 46, 69, .9), rgba(27, 33, 52, .9));
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(160, 143, 255, .48);
      color: #fff;
      background: linear-gradient(180deg, rgba(54, 59, 88, .98), rgba(35, 41, 65, .98));
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }

    button:active { transform: translateY(0) scale(.985); }
    button:focus-visible { outline: 3px solid rgba(101, 217, 237, .55); outline-offset: 3px; }

    button.primary {
      border-color: rgba(170, 151, 255, .62);
      color: #fff;
      background: linear-gradient(110deg, #735ce0, #9877f3 58%, #5d9be9);
      box-shadow: 0 8px 26px rgba(117, 88, 228, .25), inset 0 1px 0 rgba(255,255,255,.22);
    }

    button.primary:hover {
      background: linear-gradient(110deg, #826df0, #a58aff 58%, #73b2f4);
      box-shadow: 0 12px 32px rgba(117, 88, 228, .36);
    }

    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .section-heading { margin: 34px 0 16px; font-size: 25px; }
    #search-form { margin-bottom: 18px; }
    #search { flex: 1; min-width: 220px; margin: 0; }

    /* Notes */
    #notes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 16px;
      align-items: start;
    }

    .note {
      min-width: 0;
      margin: 0;
      padding: 22px;
      border-radius: 19px;
      background: linear-gradient(150deg, rgba(23, 29, 49, .96), rgba(15, 20, 34, .96));
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
      animation: card-rise .42s both;
    }

    .note:hover {
      transform: translateY(-3px);
      border-color: rgba(154, 131, 255, .34);
      box-shadow: 0 18px 42px rgba(0, 0, 0, .28), 0 0 28px rgba(122, 99, 232, .07);
    }

    @keyframes card-rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .note-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .note-title-row h3 { flex: 1; min-width: 0; margin: 0 0 12px; color: #f0efff; font-size: 18px; line-height: 1.35; overflow-wrap: anywhere; }

    .favorite-button {
      flex-shrink: 0;
      min-width: 38px;
      min-height: 38px;
      padding: 3px 8px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: #74809c;
      background: rgba(255,255,255,.035);
      font-size: 24px;
      line-height: 1.2;
    }

    .favorite-button:hover { color: #ffd98a; background: rgba(255, 198, 95, .1); }
    .favorite-button.is-favorite { color: #ffc96b; text-shadow: 0 0 18px rgba(255, 201, 107, .55); }
    .note-date { margin: -4px 0 14px; color: #77829f; font-size: 11px; letter-spacing: .02em; }
    .note-content { color: #c0c7dc; font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
    .note-source { margin-top: 13px; }
    .note-source a { color: var(--cyan); font-size: 12px; text-decoration: none; overflow-wrap: anywhere; }
    .note-source a:hover { color: #b8f5ff; text-decoration: underline; }

    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
    .tag {
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid rgba(145, 154, 194, .13);
      border-radius: 999px;
      color: #bdb2ff;
      background: rgba(129, 105, 240, .10);
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
    }
    .tag:hover { border-color: rgba(154, 131, 255, .42); color: #e2dcff; background: rgba(129, 105, 240, .2); }
    .note-actions { margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--line); }
    .note-actions button { min-height: 36px; padding: 7px 11px; font-size: 11px; }

    .error {
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 126, 145, .28);
      border-radius: 12px;
      color: #ffb4bf;
      background: rgba(173, 48, 76, .12);
      font-size: 13px;
    }

    .hidden { display: none !important; }
    .empty, .graph-empty {
      padding: 34px 22px;
      border: 1px dashed rgba(158, 170, 210, .22);
      border-radius: 16px;
      color: #8490ad;
      background: rgba(8, 12, 22, .48);
      text-align: center;
      font-size: 13px;
    }
    #note-count { margin: 12px 0 18px !important; color: #8f9ab7; }

    /* Tags and filters */
    .graph-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin-bottom: 18px; }
    .graph-controls > div { min-width: 180px; }
    .graph-controls label { margin-top: 0; }
    .graph-controls select { max-width: 100%; margin-bottom: 0; padding: 10px 36px 10px 12px; }
    .tags-panel { margin: 22px 0; padding: 22px; border-radius: 19px; }
    .tags-panel h3 { margin: 0 0 14px; font-size: 15px; }
    .all-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .all-tags .tag { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 6px 12px; }
    .tag-count { color: #8290ae; font-size: 10px; }

    /* Knowledge graph */
    .graph-panel {
      margin: 24px 0;
      padding: clamp(20px, 3vw, 30px);
      border-color: rgba(143, 128, 239, .22);
      border-radius: 24px;
      background:
        radial-gradient(ellipse at 80% 0%, rgba(83, 73, 173, .14), transparent 40%),
        linear-gradient(145deg, rgba(20, 25, 43, .97), rgba(10, 15, 27, .98));
      overflow: hidden;
    }

    .graph-panel h2 { display: flex; align-items: center; gap: 11px; margin-bottom: 6px; font-size: 24px; }
    .graph-panel h2::before {
      width: 10px; height: 10px; flex: 0 0 10px; border-radius: 50%; content: "";
      background: var(--cyan); box-shadow: 0 0 16px rgba(101, 217, 237, .85);
    }
    .graph-panel > p { margin: 0 0 22px; }
    #graph-status { min-height: 22px; margin: 0 0 12px; color: #9da8c5; font-size: 12px; }

    #graph-canvas {
      position: relative;
      width: 100%;
      min-height: 320px;
      max-height: min(72vh, 760px);
      overflow: auto;
      border: 1px solid rgba(130, 146, 199, .15);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 48%, rgba(92, 77, 180, .15), transparent 38%),
        linear-gradient(rgba(128, 144, 194, .055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(128, 144, 194, .055) 1px, transparent 1px),
        #090e1b;
      background-size: auto, 30px 30px, 30px 30px, auto;
      scrollbar-color: #444b70 #111728;
      overscroll-behavior: contain;
    }

    /* SVG keeps its natural dimensions: large graphs scroll instead of shrinking into a knot. */
    #graph-canvas svg { display: block; width: auto; min-width: 560px; max-width: none; height: auto; overflow: visible; }
    .graph-edge { fill: none; stroke: #8274d9; stroke-width: 2.2; opacity: .58; filter: drop-shadow(0 0 4px rgba(130, 116, 217, .5)); transition: opacity .2s ease, stroke .2s ease; pointer-events: stroke; cursor: pointer; }
    .graph-edge:hover { stroke: #78dfee; opacity: 1; stroke-width: 3.2; }
    .graph-node { fill: #18223c; stroke: #8f83eb; stroke-width: 1.8; filter: drop-shadow(0 0 8px rgba(139, 119, 255, .28)); transition: fill .2s ease, stroke .2s ease, filter .2s ease; }
    .graph-node-start { fill: #6551c8; stroke: #c2b6ff; filter: drop-shadow(0 0 15px rgba(151, 126, 255, .7)); }
    .graph-node-group { cursor: pointer; transition: opacity .2s ease; }
    .graph-node-group:hover .graph-node, .graph-node-group:focus .graph-node { fill: #34366a; stroke: #8be9f4; stroke-width: 2.8; filter: drop-shadow(0 0 14px rgba(101, 217, 237, .56)); }
    .graph-node-group:focus { outline: none; }
    .graph-label { fill: #e4e9fb; font-size: 12px; font-weight: 650; text-anchor: middle; }
    .graph-node-meta { fill: #aab4d3; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-anchor: middle; }
    .graph-node-start + .graph-node-meta { fill: #e3ddff; }
    #graph-note-details { margin: 16px 0 0; padding: 20px; border-color: rgba(101, 217, 237, .17); background: rgba(12, 19, 32, .88); }
    #graph-note-title { margin: 0 0 10px; }
    #graph-note-content { color: #b9c4dd; }
    #graph-note-open { margin-top: 16px; }

    body.modal-open { overflow: hidden; }
    .relation-modal { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 20px; }
    .relation-modal.hidden { display: none; }
    .relation-backdrop { position: absolute; inset: 0; background: rgba(3, 5, 12, .78); backdrop-filter: blur(10px); }
    .relation-dialog { position: relative; z-index: 1; width: min(100%, 650px); max-height: min(88vh, 820px); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 24px; background: linear-gradient(145deg, rgba(22, 28, 47, .98), rgba(10, 14, 26, .98)); box-shadow: 0 30px 100px rgba(0,0,0,.62); }
    .relation-dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 26px 18px; border-bottom: 1px solid var(--line); }
    .relation-dialog-head h2 { margin: 0 0 4px; font-size: 21px; }
    .relation-dialog-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .relation-dialog-body { padding: 20px 26px 24px; overflow: auto; }
    .relation-dialog label { display: block; margin: 14px 0 7px; color: var(--muted-strong); font-size: 12px; font-weight: 700; }
    .relation-dialog input, .relation-dialog select { width: 100%; min-height: 44px; padding: 10px 13px; border: 1px solid var(--line-strong); border-radius: 12px; background: #0b1020; color: var(--text); font: inherit; outline: none; }
    .relation-dialog input:focus, .relation-dialog select:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(154,131,255,.14); }
    .relation-picker { display: grid; gap: 7px; max-height: 220px; overflow: auto; margin-top: 9px; padding: 3px; }
    .relation-candidate { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 50px; padding: 10px 13px; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.025); color: var(--text); }
    .relation-candidate:hover { border-color: rgba(154,131,255,.55); background: rgba(154,131,255,.09); }
    .relation-candidate.is-selected { border-color: var(--cyan); background: rgba(101,217,237,.10); box-shadow: 0 0 0 1px rgba(101,217,237,.12) inset; }
    .relation-candidate-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 650; }
    .relation-candidate-id { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
    .relation-section-title { margin: 5px 0 8px; font-size: 13px; color: var(--muted-strong); }
    .relation-list { display: grid; gap: 8px; }
    .relation-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.025); }
    .relation-item-main { min-width: 0; display: grid; gap: 2px; }
    .relation-item-title { overflow: hidden; color: var(--text); font-size: 13px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .relation-item-meta { color: var(--muted); font-size: 11px; }
    .relation-item .danger-button { flex: 0 0 auto; padding: 7px 10px; border-color: rgba(255,126,145,.22); color: #ff9baa; font-size: 11px; }
    .relation-empty { padding: 13px; border: 1px dashed var(--line-strong); border-radius: 12px; color: var(--muted); font-size: 12px; text-align: center; }
    .relation-error { min-height: 20px; margin-top: 10px; color: var(--danger); font-size: 12px; }
    .relation-dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 16px; }
    .relation-dialog-actions button { min-height: 42px; }
    .relation-trigger { border-color: rgba(154,131,255,.26); color: var(--violet-bright); }
    .relation-trigger:hover { border-color: var(--violet); background: rgba(154,131,255,.12); }
    #graph-note-relate { margin: 16px 8px 0 0; }
    @media (max-width: 560px) {
      .relation-modal { padding: 10px; }
      .relation-dialog { max-height: 94vh; border-radius: 18px; }
      .relation-dialog-head, .relation-dialog-body { padding-left: 17px; padding-right: 17px; }
      .relation-dialog-actions { flex-direction: column-reverse; }
      .relation-dialog-actions button { width: 100%; }
    }

    /* Responsive */
    @media (min-width: 1100px) {
      .container { width: min(1320px, calc(100% - 80px)); }
      #note-form { display: grid; grid-template-columns: 1fr 1fr; column-gap: 22px; }
      #form-heading, #error, #note-form label[for="title"], #title,
      #note-form label[for="content"], #content, #note-form .actions { grid-column: 1 / -1; }
      #note-form label[for="source-url"] { grid-column: 1; }
      #source-url { grid-column: 1; }
      #note-form label[for="tags"] { grid-column: 2; grid-row: 5; }
      #tags { grid-column: 2; grid-row: 6; }
      #note-form .actions { grid-row: 7; }
    }

    @media (max-width: 720px) {
      .container { width: min(100% - 30px, 620px); margin: 28px auto 54px; }
      header { padding-top: 8px; padding-bottom: 22px; }
      header::after { position: static; margin-top: 8px; }
      h1 { font-size: 46px; }
      .panel { padding: 20px; }
      .section-heading { margin-top: 28px; }
      #notes { grid-template-columns: 1fr; }
      #search-form { align-items: stretch; }
      #search { flex-basis: 100%; }
      .graph-panel { padding: 17px; }
      .graph-controls { align-items: stretch; }
      .graph-controls > div { flex: 1 1 100%; }
      .graph-controls > button { width: 100%; }
      #graph-canvas { min-height: 260px; }
    }

    @media (max-width: 420px) {
      .container { width: calc(100% - 22px); margin-top: 20px; }
      h1 { font-size: 40px; }
      .panel, .note, .tags-panel { padding: 17px; border-radius: 17px; }
      .actions button { flex: 1 1 auto; }
      .note-actions button { flex: 1 1 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Recall</h1>
      <div class="muted">Твоя личная база знаний</div>
      <div class="account-tools"><a class="logout-button" href="/logout">Выйти</a></div>
    </header>

    <section class="panel">
      <h2 id="form-heading">Новая заметка</h2>

      <div id="error" class="error hidden"></div>

      <form id="note-form">
        <label for="title">Название</label>
        <input id="title" maxlength="255" required
               placeholder="Например, как устроен граф заметок">

        <label for="content">Содержание</label>
        <textarea id="content" required
                  placeholder="Запиши свою мысль..."></textarea>

        <label for="source-url">Ссылка на источник (необязательно)</label>
        <input id="source-url" type="url"
               placeholder="https://example.com">

        <label for="tags">Теги через запятую</label>
        <input id="tags" placeholder="python, backend, идеи">

        <div class="actions">
          <button class="primary" type="submit" id="save-button">
            Сохранить заметку
          </button>
          <button type="button" id="cancel-button" class="hidden">
            Отмена
          </button>
        </div>
      </form>
    </section>

    <section>
      <h2 class="section-heading">Мои заметки</h2>

<div class="tags-panel">
    <h3>Теги</h3>
    <div id="all-tags" class="all-tags"></div>
</div>
<section class="graph-panel">
  <h2>Граф заметок</h2>
  <p class="muted">Связи между заметками на основе созданных отношений.</p>

  <div class="graph-controls">
    <div>
      <label for="graph-start">Начальная заметка</label>

        <option value="">Загрузка заметок...</option>

      <label for="graph-depth">Глубина связей</label>
      <select id="graph-depth">

        <option value="2" selected>2 уровня</option>
        <option value="3">3 уровня</option>
        <option value="4">4 уровня</option>
        <option value="5">5 уровней</option>
      </select>
    </div>

    <button type="button" id="load-graph" class="primary">
      Показать граф
    </button>
  </div>

  <div id="graph-status" class="muted" role="status"></div>
  <div id="graph-canvas">
    <div class="graph-empty">Выбери начальную заметку.</div>
  </div>
  
  <div id="graph-note-details" class="panel hidden">
    <h3 id="graph-note-title"></h3>
    <div id="graph-note-content" class="note-content"></div>
    <div id="graph-note-tags" class="tags"></div>
    <button type="button" id="graph-note-open">
      Построить граф от этой заметки
    </button>

</section>



      <div id="notes"></div>

    </section>
  </main>

  <div id="relation-modal" class="relation-modal hidden" role="dialog" aria-modal="true" aria-labelledby="relation-modal-title" aria-hidden="true">
    <div class="relation-backdrop" data-relation-close></div>
    <section class="relation-dialog">
      <div class="relation-dialog-head">
        <div>
          <h2 id="relation-modal-title">Связи заметки</h2>
          <p id="relation-modal-subtitle">Выбирай только заметки из своего пространства.</p>
        </div>
        <button type="button" id="relation-close" aria-label="Закрыть окно">✕</button>
      </div>
      <div class="relation-dialog-body">
        <h3 class="relation-section-title">Уже связанные заметки</h3>
        <div id="relation-list" class="relation-list"><div class="relation-empty">Загружаем связи…</div></div>

        <label for="relation-search">Добавить связь с заметкой</label>
        <input id="relation-search" type="search" autocomplete="off" placeholder="Начни вводить название заметки…">
        <div id="relation-picker" class="relation-picker" role="listbox" aria-label="Твои заметки"></div>

        <label for="relation-type">Тип связи</label>
        <select id="relation-type">
          <option value="related">Связана с этой темой</option>
          <option value="continues">Продолжает эту тему</option>
          <option value="explains">Объясняет эту тему</option>
          <option value="example">Является примером</option>
          <option value="prerequisite">Нужно изучить заранее</option>
          <option value="contrasts">Противопоставляется</option>
        </select>
        <div id="relation-error" class="relation-error" role="status"></div>
        <div class="relation-dialog-actions">
          <button type="button" data-relation-close>Закрыть</button>
          <button type="button" id="relation-create" class="primary" disabled>Создать связь</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const form = document.querySelector("#note-form");
    const titleInput = document.querySelector("#title");
    const contentInput = document.querySelector("#content");
    const sourceInput = document.querySelector("#source-url");
    const tagsInput = document.querySelector("#tags");
    const notesContainer = document.querySelector("#notes");
    const errorBox = document.querySelector("#error");

    let editingId = null;

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...options.headers
        }
      });

      if (!response.ok) {
        let message = `Ошибка сервера: ${response.status}`;
        try {
          const data = await response.json();
          message = data.detail || message;
        } catch {}
        throw new Error(
          typeof message === "string" ? message : JSON.stringify(message)
        );
      }

      if (response.status === 204) return null;
      return response.json();
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.add("hidden");
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderNotes(notes) {
      notesContainer.replaceChildren();
      document.querySelector("#note-count").textContent =
        `Заметок: ${notes.length}`;

      if (!notes.length) {
        notesContainer.append(
          makeElement("div", "empty", "Заметок пока нет.")
        );
        return;
      }

      for (const note of notes) {
        const card = makeElement("article", "note");

        const titleRow = makeElement("div", "note-title-row");
        const title = makeElement("h3", "", note.title);

        const favoriteButton = makeElement(
          "button",
          "favorite-button",
          note.is_favorite ? "★" : "☆"
        );

        favoriteButton.type = "button";
        favoriteButton.title = note.is_favorite
          ? "Убрать из избранного"
          : "Добавить в избранное";
        favoriteButton.setAttribute("aria-label", favoriteButton.title);

        if (note.is_favorite) {
          favoriteButton.classList.add("is-favorite");
        }

        favoriteButton.addEventListener("click", () => {
          toggleFavorite(note.id);
        });

        titleRow.append(title, favoriteButton);
        card.append(titleRow);

        
        const date = note.created_at
        ? new Date(note.created_at)
        : null;

        const dateText = date && !Number.isNaN(date.getTime())
        ? date.toLocaleString("ru-RU", {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
            })
        : "Дата неизвестна";

        card.append(makeElement("div", "muted note-date", dateText));

        card.append(makeElement("div", "note-content", note.content));

        if (note.source_url) {
          const source = makeElement("div", "note-source");
          const link = makeElement("a", "", "Открыть источник");
          link.href = note.source_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          source.append(link);
          card.append(source);
        }

        
        if (note.tags?.length) {
        const tags = makeElement("div", "tags");

        for (const name of note.tags) {
            const tagButton = makeElement("button", "tag", name);
            tagButton.type = "button";
            tagButton.title = `Показать заметки с тегом ${name}`;

            tagButton.addEventListener("click", () => {
            filterByTag(name);
            });

            tags.append(tagButton);
        }

        card.append(tags);
        }


        const actions = makeElement("div", "actions note-actions");
        const editButton = makeElement("button", "", "Редактировать");
        editButton.type = "button";
        editButton.addEventListener("click", () => startEditing(note));

        const deleteButton = makeElement("button", "", "Удалить");
        deleteButton.type = "button";
        deleteButton.addEventListener("click", () => deleteNote(note.id));

        const graphButton = makeElement("button", "", "Показать в графе");
        graphButton.type = "button";

        graphButton.addEventListener("click", async () => {
          let option = [...graphStartSelect.options].find(
            option => option.value === String(note.id)
          );

          if (!option) {
            option = document.createElement("option");
            option.value = String(note.id);
            option.textContent = `#${note.id} — ${note.title}`;
            graphStartSelect.append(option);
          }

          graphStartSelect.value = String(note.id);
          await loadGraph();

          document.querySelector(".graph-panel").scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        });

        const relationButton = makeElement("button", "relation-trigger", "Связать");
        relationButton.type = "button";
        relationButton.addEventListener("click", () => openRelationManager(note.id, note.title));

        actions.append(editButton, deleteButton, graphButton, relationButton);
        card.append(actions);
        notesContainer.append(card);
      }
    }

    const graphStartSelect = document.querySelector("#graph-start");
    const graphDepthSelect = document.querySelector("#graph-depth");
    const graphStatus = document.querySelector("#graph-status");
    const graphCanvas = document.querySelector("#graph-canvas");
    const graphNoteDetails = document.querySelector("#graph-note-details");
    const graphNoteTitle = document.querySelector("#graph-note-title");
    const graphNoteContent = document.querySelector("#graph-note-content");
    const graphNoteTags = document.querySelector("#graph-note-tags");
    const graphNoteOpen = document.querySelector("#graph-note-open");

    let selectedGraphNoteId = null;

    
    async function showGraphNote(noteId) {
      try {
        const note = await api(`/notes/${noteId}`);

        selectedGraphNoteId = note.id;
        graphNoteTitle.textContent = note.title;
        graphNoteContent.textContent = note.content;

        graphNoteTags.replaceChildren();

        for (const tag of note.tags ?? []) {
          graphNoteTags.append(
            makeElement("span", "tag", tag)
          );
        }

        graphNoteDetails.classList.remove("hidden");
      } catch (error) {
        graphStatus.textContent =
          `Не удалось загрузить заметку: ${error.message}`;
      }
    }

    graphNoteOpen.addEventListener("click", async () => {
      if (selectedGraphNoteId === null) {
        graphStatus.textContent = "Ошибка: заметка не выбрана.";
        return;
      }

      graphStartSelect.value = String(selectedGraphNoteId);

      await loadGraph();
    });

    const relationModal = document.querySelector("#relation-modal");
    const relationModalTitle = document.querySelector("#relation-modal-title");
    const relationModalSubtitle = document.querySelector("#relation-modal-subtitle");
    const relationList = document.querySelector("#relation-list");
    const relationSearch = document.querySelector("#relation-search");
    const relationPicker = document.querySelector("#relation-picker");
    const relationType = document.querySelector("#relation-type");
    const relationError = document.querySelector("#relation-error");
    const relationCreateButton = document.querySelector("#relation-create");
    const graphNoteRelate = document.querySelector("#graph-note-relate");

    let activeRelationSourceId = null;
    let activeRelationSourceTitle = "";
    let relationCandidates = [];
    let selectedRelationTargetId = null;
    let activeRelations = [];
    const relationTypeLabels = {
      related: "Связана с этой темой",
      continues: "Продолжает эту тему",
      explains: "Объясняет эту тему",
      example: "Является примером",
      prerequisite: "Нужно изучить заранее",
      contrasts: "Противопоставляется",
      depends_on: "Зависит от",
      learns: "Связана с изучением"
    };

    async function fetchAllOwnNotes() {
      const allNotes = [];
      let offset = 0;
      const limit = 100;
      while (true) {
        const batch = await api(`/notes?limit=${limit}&offset=${offset}`);
        allNotes.push(...batch);
        if (batch.length < limit) break;
        offset += batch.length;
      }
      return allNotes;
    }

    function closeRelationManager() {
      relationModal.classList.add("hidden");
      relationModal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      activeRelationSourceId = null;
      selectedRelationTargetId = null;
    }

    function renderRelationCandidates() {
      relationPicker.replaceChildren();
      const query = relationSearch.value.trim().toLocaleLowerCase("ru-RU");
      const filtered = relationCandidates.filter(note =>
        String(note.title).toLocaleLowerCase("ru-RU").includes(query)
      );

      if (!filtered.length) {
        relationPicker.append(makeElement(
          "div",
          "relation-empty",
          query ? "Ничего не найдено." : "Нет других заметок для связи. Сначала создай ещё одну заметку."
        ));
        relationCreateButton.disabled = true;
        return;
      }

      for (const note of filtered) {
        const button = makeElement("button", "relation-candidate");
        button.type = "button";
        button.setAttribute("role", "option");
        button.setAttribute("aria-selected", String(selectedRelationTargetId === Number(note.id)));
        if (selectedRelationTargetId === Number(note.id)) button.classList.add("is-selected");
        button.append(
          makeElement("span", "relation-candidate-title", note.title),
          makeElement("span", "relation-candidate-id", `#${note.id}`)
        );
        button.addEventListener("click", () => {
          selectedRelationTargetId = Number(note.id);
          relationError.textContent = "";
          renderRelationCandidates();
        });
        relationPicker.append(button);
      }
      relationCreateButton.disabled = selectedRelationTargetId === null;
    }

    async function renderExistingRelations() {
      relationList.replaceChildren();
      const noteById = new Map(relationCandidates.map(note => [Number(note.id), note]));
      if (!activeRelations.length) {
        relationList.append(makeElement("div", "relation-empty", "У этой заметки пока нет связей."));
        return;
      }

      for (const relation of activeRelations) {
        const sourceId = Number(relation.source_note_id);
        const targetId = Number(relation.target_note_id);
        const isOutgoing = sourceId === activeRelationSourceId;
        const otherId = isOutgoing ? targetId : sourceId;
        const otherNote = noteById.get(otherId);

        const item = makeElement("div", "relation-item");
        const main = makeElement("div", "relation-item-main");
        main.append(
          makeElement("span", "relation-item-title", otherNote?.title || `Заметка #${otherId}`),
          makeElement("span", "relation-item-meta", `${isOutgoing ? "Исходящая" : "Входящая"} · ${relationTypeLabels[relation.relation_type] || relation.relation_type}`)
        );
        const removeButton = makeElement("button", "danger-button", "Удалить");
        removeButton.type = "button";
        removeButton.addEventListener("click", async () => {
          removeButton.disabled = true;
          try {
            await api(`/notes/${activeRelationSourceId}/relations/${relation.id}`, { method: "DELETE" });
            activeRelations = activeRelations.filter(item => item.id !== relation.id);
            await renderExistingRelations();
            relationError.textContent = "Связь удалена.";
            if (graphStartSelect.value === String(activeRelationSourceId)) await loadGraph();
          } catch (error) {
            relationError.textContent = error.message;
            removeButton.disabled = false;
          }
        });
        item.append(main, removeButton);
        relationList.append(item);
      }
    }

    async function openRelationManager(noteId, noteTitle = "") {
      activeRelationSourceId = Number(noteId);
      activeRelationSourceTitle = noteTitle;
      selectedRelationTargetId = null;
      relationSearch.value = "";
      relationType.value = "related";
      relationError.textContent = "";
      relationCreateButton.disabled = true;
      relationModalTitle.textContent = "Связи заметки";
      relationModalSubtitle.textContent = noteTitle || `Настрой связи заметки #${noteId}`;
      relationList.replaceChildren(makeElement("div", "relation-empty", "Загружаем связи…"));
      relationPicker.replaceChildren(makeElement("div", "relation-empty", "Загружаем твои заметки…"));
      relationModal.classList.remove("hidden");
      relationModal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      relationSearch.focus();

      try {
        const [notes, relations] = await Promise.all([
          fetchAllOwnNotes(),
          api(`/notes/${noteId}/relations`)
        ]);
        relationCandidates = notes.filter(note => Number(note.id) !== activeRelationSourceId);
        activeRelations = relations;
        if (!activeRelationSourceTitle) {
          const source = notes.find(note => Number(note.id) === activeRelationSourceId);
          activeRelationSourceTitle = source?.title || `Заметка #${noteId}`;
          relationModalSubtitle.textContent = activeRelationSourceTitle;
        }
        renderRelationCandidates();
        await renderExistingRelations();
      } catch (error) {
        relationError.textContent = `Не удалось загрузить связи: ${error.message}`;
        relationPicker.replaceChildren();
        relationList.replaceChildren(makeElement("div", "relation-empty", "Не удалось получить список связей."));
      }
    }

    relationSearch.addEventListener("input", () => {
      selectedRelationTargetId = null;
      relationCreateButton.disabled = true;
      renderRelationCandidates();
    });
    relationCreateButton.addEventListener("click", async () => {
      if (activeRelationSourceId === null || selectedRelationTargetId === null) return;
      relationCreateButton.disabled = true;
      relationError.textContent = "Создаём связь…";
      try {
        await api(`/notes/${activeRelationSourceId}/relations`, {
          method: "POST",
          body: JSON.stringify({
            target_note_id: selectedRelationTargetId,
            relation_type: relationType.value
          })
        });
        activeRelations = await api(`/notes/${activeRelationSourceId}/relations`);
        selectedRelationTargetId = null;
        renderRelationCandidates();
        await renderExistingRelations();
        relationError.textContent = "Связь создана.";
        if (graphStartSelect.value === String(activeRelationSourceId)) await loadGraph();
      } catch (error) {
        relationError.textContent = error.message;
        relationCreateButton.disabled = selectedRelationTargetId === null;
      }
    });

    document.querySelectorAll("[data-relation-close]").forEach(element => {
      element.addEventListener("click", closeRelationManager);
    });
    document.querySelector("#relation-close").addEventListener("click", closeRelationManager);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !relationModal.classList.contains("hidden")) closeRelationManager();
    });
    graphNoteRelate.addEventListener("click", () => {
      if (selectedGraphNoteId !== null) openRelationManager(selectedGraphNoteId, graphNoteTitle.textContent);
    });

    async function loadGraphOptions() {
      try {
        const notes = [];
        let offset = 0;
        const limit = 100;

        while (true) {
          const batch = await api(
            `/notes?limit=${limit}&offset=${offset}`
          );

          notes.push(...batch);

          if (batch.length < limit) {
            break;
          }

          offset += limit;
        }

        graphStartSelect.replaceChildren();

        if (!notes.length) {
          graphStartSelect.append(
            makeElement("option", "", "Нет заметок")
          );
          graphStartSelect.disabled = true;
          graphStatus.textContent = "Сначала создай заметку.";
          return;
        }

        graphStartSelect.disabled = false;

        for (const note of notes) {
          const option = document.createElement("option");
          option.value = note.id;
          option.textContent = `#${note.id} — ${note.title}`;
          graphStartSelect.append(option);
        }

        graphStatus.textContent =
          `Доступно заметок: ${notes.length}`;
      } catch (error) {
        graphStatus.textContent =
          `Не удалось загрузить заметки: ${error.message}`;
      }
    }

      function renderGraph(graph) {
        graphCanvas.replaceChildren();

        const startOption = graphStartSelect.selectedOptions[0];
        const startTitle = startOption
          ? startOption.textContent.replace(/^#\d+\s*[—-]\s*/, "")
          : `Заметка #${graph.start_note_id}`;

        const nodes = [
          { id: Number(graph.start_note_id), title: startTitle, depth: 0 },
          ...graph.notes.map(note => ({
            ...note,
            id: Number(note.id),
            depth: Math.max(1, Number(note.depth) || 1)
          }))
        ];

        if (graph.relations.length === 0) {
          graphCanvas.append(
            makeElement(
              "div",
              "graph-empty",
              "Связей пока нет. Создай отношение между заметками, чтобы увидеть граф."
            )
          );
          return;
        }

        const nodeById = new Map(nodes.map(node => [node.id, node]));
        const levels = new Map();
        const neighbors = new Map(nodes.map(node => [node.id, new Set()]));

        for (const node of nodes) {
          if (!levels.has(node.depth)) levels.set(node.depth, []);
          levels.get(node.depth).push(node);
        }

        for (const relation of graph.relations) {
          const sourceId = Number(relation.source_note_id);
          const targetId = Number(relation.target_note_id);
          if (!nodeById.has(sourceId) || !nodeById.has(targetId)) continue;
          neighbors.get(sourceId).add(targetId);
          neighbors.get(targetId).add(sourceId);
        }

        // Order each depth by the average position of its parents from the previous depth.
        // This reduces crossed lines in layered graphs and keeps sibling nodes apart.
        const orderById = new Map();
        const maxDepth = Math.max(...levels.keys());
        for (let depth = 0; depth <= maxDepth; depth += 1) {
          const level = levels.get(depth) || [];
          if (depth > 0) {
            level.sort((a, b) => {
              const parentOrder = node => {
                const parentIndexes = [...neighbors.get(node.id)]
                  .map(id => nodeById.get(id))
                  .filter(parent => parent && parent.depth === depth - 1)
                  .map(parent => orderById.get(parent.id))
                  .filter(Number.isFinite);
                return parentIndexes.length
                  ? parentIndexes.reduce((sum, value) => sum + value, 0) / parentIndexes.length
                  : Number.MAX_SAFE_INTEGER;
              };
              return parentOrder(a) - parentOrder(b)
                || String(a.title).localeCompare(String(b.title), "ru");
            });
          }
          level.forEach((node, index) => orderById.set(node.id, index));
        }

        const nodeWidth = 228;
        const nodeHeight = 76;
        const columnGap = 112;
        const rowGap = 42;
        const horizontalPadding = 58;
        const verticalPadding = 72;
        const maxInLevel = Math.max(...[...levels.values()].map(level => level.length));
        const height = Math.max(440, verticalPadding * 2 + maxInLevel * (nodeHeight + rowGap));
        const width = horizontalPadding * 2 + (maxDepth + 1) * nodeWidth + maxDepth * columnGap;
        const positions = new Map();

        for (let depth = 0; depth <= maxDepth; depth += 1) {
          const level = levels.get(depth) || [];
          const totalHeight = level.length * nodeHeight + Math.max(0, level.length - 1) * rowGap;
          const firstY = (height - totalHeight) / 2 + nodeHeight / 2;
          const x = horizontalPadding + nodeWidth / 2 + depth * (nodeWidth + columnGap);
          level.forEach((node, index) => {
            positions.set(node.id, {
              x,
              y: firstY + index * (nodeHeight + rowGap)
            });
          });
        }

        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("width", String(width));
        svg.setAttribute("height", String(height));
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", "Граф связанных заметок, расположенный по уровням связей");

        function svgElement(tag, attributes, text) {
          const element = document.createElementNS(svgNS, tag);
          for (const [name, value] of Object.entries(attributes)) {
            element.setAttribute(name, value);
          }
          if (text !== undefined) element.textContent = text;
          return element;
        }

        // Draw edges first so that node cards remain visually on top of connections.
        for (const relation of graph.relations) {
          const source = positions.get(Number(relation.source_note_id));
          const target = positions.get(Number(relation.target_note_id));
          if (!source || !target) continue;

          const direction = target.x >= source.x ? 1 : -1;
          const startX = source.x + direction * (nodeWidth / 2 - 2);
          const endX = target.x - direction * (nodeWidth / 2 - 2);
          const controlX = (startX + endX) / 2;
          const edge = svgElement("path", {
            d: `M ${startX} ${source.y} C ${controlX} ${source.y}, ${controlX} ${target.y}, ${endX} ${target.y}`,
            class: "graph-edge",
            "data-relation-type": relation.relation_type,
            "aria-label": `Тип связи: ${relation.relation_type}`
          });

          edge.addEventListener("click", event => {
            event.stopPropagation();
            graphStatus.textContent = `Тип связи: ${relation.relation_type}`;
          });
          svg.append(edge);
        }

        function shortenTitle(value, maxLength = 28) {
          const title = String(value || "Без названия").replace(/\s+/g, " ").trim();
          return title.length > maxLength ? `${title.slice(0, maxLength - 1)}…` : title;
        }

        for (const node of nodes) {
          const position = positions.get(node.id);
          if (!position) continue;
          const isStart = node.id === Number(graph.start_note_id);
          const group = svgElement("g", {});
          group.setAttribute("class", "graph-node-group");
          group.setAttribute("role", "button");
          group.setAttribute("tabindex", "0");
          group.setAttribute("aria-label", `Открыть заметку: ${node.title}`);

          const openFromNode = () => showGraphNote(node.id);
          group.addEventListener("click", openFromNode);
          group.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openFromNode();
            }
          });

          group.append(
            svgElement("rect", {
              x: position.x - nodeWidth / 2,
              y: position.y - nodeHeight / 2,
              width: nodeWidth,
              height: nodeHeight,
              rx: 16,
              class: isStart ? "graph-node graph-node-start" : "graph-node"
            }),
            svgElement("text", {
              x: position.x,
              y: position.y - 10,
              class: "graph-node-meta"
            }, `${isStart ? "НАЧАЛО" : `УРОВЕНЬ ${node.depth}`}  ·  #${node.id}`),
            svgElement("text", {
              x: position.x,
              y: position.y + 14,
              class: isStart ? "graph-label graph-label-start" : "graph-label"
            }, shortenTitle(node.title))
          );
          svg.append(group);
        }

        graphCanvas.append(svg);
        graphCanvas.scrollTop = 0;
        graphCanvas.scrollLeft = 0;
      }



    async function loadGraph() {
      const noteId = graphStartSelect.value;
      const depth = graphDepthSelect.value;

      if (!noteId) {
        graphStatus.textContent = "Выбери начальную заметку.";
        return;
      }

      graphStatus.textContent = "Загружаю граф...";
      graphCanvas.replaceChildren();

      try {
        const graph = await api(
          `/notes/${noteId}/graph?depth=${depth}`
        );

        graphStatus.textContent =
          `Найдено связанных заметок: ${graph.notes.length}. ` +
          `Связей: ${graph.relations.length}.`;

        renderGraph(graph);
      } catch (error) {
        graphStatus.textContent =
          `Не удалось загрузить граф: ${error.message}`;
        graphCanvas.replaceChildren(
          makeElement("div", "graph-empty", error.message)
        );
      }
    }

    document.querySelector("#load-graph").addEventListener(
      "click",
      loadGraph
    );

    loadGraphOptions();


    
    async function loadNotes(path = "/notes") {
      currentView = path;
      clearError();

      try {
        let notes;

        // Поддерживаем пагинацию для обычного списка
        // и фильтров, например /notes?favorite=true.
        if (path === "/notes" || path.startsWith("/notes?")) {
          const questionIndex = path.indexOf("?");
          const endpoint =
            questionIndex === -1 ? path : path.slice(0, questionIndex);
          const queryString =
            questionIndex === -1 ? "" : path.slice(questionIndex + 1);

          const baseParams = new URLSearchParams(queryString);

          notes = [];
          let offset = 0;
          const limit = 100;

          while (true) {
            const params = new URLSearchParams(baseParams);
            params.set("limit", String(limit));
            params.set("offset", String(offset));

            const batch = await api(
              `${endpoint}?${params.toString()}`
            );

            notes.push(...batch);
            offset += batch.length;

            if (batch.length < limit) {
              break;
            }
          }
        } else {
          notes = await api(path);
        }

        renderNotes(notes);
      } catch (error) {
        showError(error.message);
      }
    }


    async function toggleFavorite(noteId) {
      clearError();

      try {
        await api(`/notes/${noteId}/favorite`, {
          method: "PATCH"
        });

        await refreshCurrentView();
      } catch (error) {
        showError(error.message);
      }
    }

    let currentView = "/notes";

    async function refreshCurrentView() {
      await loadNotes(currentView);
      await loadTags();
    }


    
    
    async function loadTags() {
        const container = document.querySelector("#all-tags");
        const tagFilter = document.querySelector("#tag-filter");

        container.replaceChildren();

        try {
            const tags = await api("/tags");

            // Заполняем выпадающий список
            const selectedTag = tagFilter.value;
            tagFilter.replaceChildren();

            const allOption = document.createElement("option");
            allOption.value = "";
            allOption.textContent = "Все теги";
            tagFilter.appendChild(allOption);

            for (const tag of tags) {
                const option = document.createElement("option");
                option.value = tag.name;
                option.textContent = `${tag.name} (${tag.notes_count})`;
                tagFilter.appendChild(option);
            }

            // Сохраняем выбор, если такой тег ещё существует
            tagFilter.value = selectedTag;

            // Если тегов нет, показываем сообщение
            if (!tags.length) {
                container.append(
                    makeElement("span", "muted", "Пока нет тегов")
                );
                return;
            }

            // Создаём кнопки тегов
            for (const tag of tags) {
                const button = makeElement("button", "tag");
                button.type = "button";
                button.dataset.tag = tag.name.toLowerCase();

                button.append(document.createTextNode(tag.name + " "));

                const count = makeElement(
                    "span",
                    "tag-count",
                    String(tag.notes_count)
                );

                button.append(count);
                button.title = `Показать заметки с тегом ${tag.name}`;

                button.addEventListener("click", () => {
                    filterByTag(tag.name);
                });

                container.append(button);
            }
        } catch (error) {
            showError(`Не удалось загрузить теги: ${error.message}`);
        }
    }


    
    async function filterByTag(tagName) {
    document.querySelector("#search").value = "";
    clearError();

    try {
        const notes = await api(
        `/tags/${encodeURIComponent(tagName)}/notes`
        );
        renderNotes(notes);
        document.querySelector("#note-count").textContent =
        `Тег: ${tagName} · Заметок: ${notes.length}`;
    } catch (error) {
        showError(error.message);
    }
    }


    function resetForm() {
      editingId = null;
      form.reset();
      clearError();
      document.querySelector("#form-heading").textContent = "Новая заметка";
      document.querySelector("#save-button").textContent = "Сохранить заметку";
      document.querySelector("#cancel-button").classList.add("hidden");
    }

    function startEditing(note) {
      editingId = note.id;
      titleInput.value = note.title;
      contentInput.value = note.content;
      sourceInput.value = note.source_url || "";
      tagsInput.value = (note.tags || []).join(", ");

      document.querySelector("#form-heading").textContent =
        "Редактирование заметки";
      document.querySelector("#save-button").textContent = "Сохранить изменения";
      document.querySelector("#cancel-button").classList.remove("hidden");
      clearError();
      window.scrollTo({ top: 0, behavior: "smooth" });
      titleInput.focus();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();

      const payload = {
        title: titleInput.value.trim(),
        content: contentInput.value.trim(),
        source_url: sourceInput.value.trim() || null,
        tags: tagsInput.value
          .split(",")
          .map(tag => tag.trim())
          .filter(Boolean)
      };

      try {
        const path = editingId === null
          ? "/notes"
          : `/notes/${editingId}`;

        await api(path, {
          method: editingId === null ? "POST" : "PUT",
          body: JSON.stringify(payload)
        });

        resetForm();
        await loadNotes();
        await loadTags();
      } catch (error) {
        showError(error.message);
      }
    });

    async function deleteNote(id) {
      if (!confirm("Удалить эту заметку?")) return;

      clearError();
      try {
        await api(`/notes/${id}`, { method: "DELETE" });
        if (editingId === id) resetForm();
        await loadNotes();
        await loadTags();
      } catch (error) {
        showError(error.message);
      }
    }

    document.querySelector("#cancel-button").addEventListener(
      "click", resetForm
    );
    document.querySelector("#search-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        await loadFilteredNotes();
    });

    let favoritesOnly = false;
    
    async function loadFilteredNotes() {
        const sortBy = document.querySelector("#sort-by").value;
        const search = document.querySelector("#search").value.trim();
        const tag = document.querySelector("#tag-filter").value;

        const params = new URLSearchParams();
        params.set("sort_by", sortBy);

        if (search) {
            params.set("q", search);
        }

        if (tag) {
            params.set("tag", tag);
        }

        if (favoritesOnly) {
            params.set("favorite", "true");
        }

        await loadNotes(`/notes?${params.toString()}`);
    }


    document.querySelector("#sort-by").addEventListener("change", loadFilteredNotes);
    document.querySelector("#tag-filter").addEventListener("change", loadFilteredNotes);

    document.querySelector("#show-all").addEventListener("click", async () => {
        favoritesOnly = false;
        document.querySelector("#search").value = "";
        document.querySelector("#tag-filter").value = "";

        await loadFilteredNotes();
        await loadTags();
    });

    document.querySelector("#show-favorites").addEventListener("click", async () => {
        favoritesOnly = true;
        document.querySelector("#search").value = "";
        document.querySelector("#tag-filter").value = "";

        await loadFilteredNotes();
        await loadTags();
    });

    loadNotes();
    loadTags();
  </script>
</body>
