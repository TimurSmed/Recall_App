
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recall — мои заметки</title>
  <style>

    .note-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .note-title-row h3 {
      flex: 1;
      min-width: 0;
    }

    .favorite-button {
      flex-shrink: 0;
      padding: 3px 8px;
      border: none;
      font-size: 26px;
      line-height: 1.2;
      color: #777;
    }

    .favorite-button:hover {
      background: #f7f3e8;
    }

    .favorite-button.is-favorite {
      color: #d99a00;
    }
    
    * {
    box-sizing: border-box;
    }

    body {
    margin: 0;
    background: #f7f7f8;
    color: #252525;
    font-family: "Segoe UI", Arial, sans-serif;
    line-height: 1.6;
    }

    .container {
    width: min(760px, 92%);
    margin: 48px auto;
    }

    header {
    margin-bottom: 30px;
    }

    h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: -1px;
    }

    h2 {
    margin: 0 0 18px;
    font-size: 21px;
    }

    .muted {
    color: #777;
    font-size: 14px;
    }

    .panel,
    .note {
    background: #fff;
    border: 1px solid #e7e7e9;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgb(0 0 0 / 3%);
    }

    label {
    display: block;
    margin: 12px 0 6px;
    font-size: 14px;
    font-weight: 600;
    }

    input,
    textarea {
    display: block;
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #dedee3;
    border-radius: 9px;
    background: #fff;
    color: #252525;
    font: inherit;
    outline: none;
    margin: 0 0 14px;
    }

    input:focus,
    textarea:focus {
    border-color: #777;
    box-shadow: 0 0 0 3px rgb(0 0 0 / 5%);
    }

    textarea {
    min-height: 130px;
    resize: vertical;
    }

    button {
    padding: 10px 15px;
    border: 1px solid #dedee3;
    border-radius: 9px;
    background: #fff;
    color: #252525;
    font: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
    }

    button:hover {
    background: #f0f0f2;
    }

    button.primary {
    background: #252525;
    color: #fff;
    border-color: #252525;
    }

    button.primary:hover {
    background: #444;
    }

    .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    }

    .section-heading {
    margin: 30px 0 14px;
    }

    #search-form {
    margin-bottom: 16px;
    }

    #search {
    flex: 1;
    min-width: 180px;
    margin: 0;
    }

    .note h3 {
    margin: 0 0 12px;
    font-size: 19px;
    overflow-wrap: anywhere;
    }

    .note-content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    }

    .note-source {
    margin-top: 12px;
    }

    .note-source a {
    color: #555;
    overflow-wrap: anywhere;
    }

    .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 16px;
    }

    
    .tag {
    padding: 5px 11px;
    border: none;
    border-radius: 20px;
    background: #f0f0f2;
    color: #444;
    font-size: 12px;
    cursor: pointer;
    }

    .tag:hover {
    background: #dedee3;
    }


    .note-actions {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #eee;
    }

    .error {
    color: #b42318;
    margin-bottom: 12px;
    }

    .hidden {
    display: none;
    }

    .empty {
    padding: 30px;
    text-align: center;
    color: #777;
    background: #fff;
    border: 1px dashed #ddd;
    border-radius: 12px;
    }

    @media (max-width: 500px) {
    .container {
        margin: 28px auto;
    }

    .panel,
    .note {
        padding: 17px;
    }

    h1 {
        font-size: 29px;
    }
    }
    
    .note-date {
    margin: -6px 0 14px;
    font-size: 12px;
    }

    
    .tags-panel {
    margin: 20px 0;
    padding: 18px;
    background: #fff;
    border: 1px solid #e7e7e9;
    border-radius: 12px;
    }

    .tags-panel h3 {
    margin: 0 0 12px;
    font-size: 16px;
    }

    .all-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    }

    .all-tags .tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    }

    .tag-count {
    color: #777;
    font-size: 11px;
    }

    .graph-panel {
      margin: 20px 0;
      padding: 18px;
      background: #fff;
      border: 1px solid #e7e7e9;
      border-radius: 12px;
    }

    .graph-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      margin-bottom: 16px;
    }

    .graph-controls label {
      margin-top: 0;
    }

    .graph-controls select {
      padding: 10px;
      border: 1px solid #dedee3;
      border-radius: 9px;
      font: inherit;
      max-width: 100%;
    }

    #graph-canvas {
      width: 100%;
      min-height: 260px;
      overflow: hidden;
      border: 1px solid #eee;
      border-radius: 10px;
      background: #fafafa;
    }

    #graph-canvas svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .graph-edge {
      stroke: #b8bbc4;
      stroke-width: 2;
    }

    
    .graph-edge-label {
      fill: #666;
      font-size: 11px;
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke;
      stroke: #fafafa;
      stroke-width: 4px;
      stroke-linejoin: round;
      pointer-events: none;
    }


    .graph-node {
      fill: #fff;
      stroke: #777;
      stroke-width: 1.5;
    }

    .graph-node-start {
      fill: #252525;
      stroke: #252525;
    }

    .graph-node-group {
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .graph-node-group:hover .graph-node {
      stroke: #2563eb;
      stroke-width: 3;
    }

    .graph-node-group:focus .graph-node {
      stroke: #2563eb;
      stroke-width: 3;
    }

    .graph-node-group:focus {
      outline: none;
    }

    .graph-label {
      fill: #252525;
      font-size: 12px;
      text-anchor: middle;
    }

    .graph-label-start {
      fill: #fff;
    }

    .graph-empty {
      padding: 24px;
      color: #777;
      text-align: center;
    }



  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Recall</h1>
      <div class="muted">Твоя личная база знаний</div>
    </header>

    <section class="panel">
      <h2 id="form-heading">Новая заметка</h2>

      <div id="error" class="error hidden"></div>

      <form id="note-form">
        <label for="title">Название</label>
        <input id="title" maxlength="255" required
               placeholder="Например, как работает SQLAlchemy">

        <label for="content">Содержание</label>
        <textarea id="content" required
                  placeholder="Запиши свою мысль..."></textarea>

        <label for="source-url">Ссылка на источник (необязательно)</label>
        <input id="source-url" type="url"
               placeholder="https://example.com">

        <label for="tags">Теги через запятую</label>
        <input id="tags" placeholder="python, backend, идеи">

        <div class="actions">
          <button class="primary" type="submit" id="save-button">
            Сохранить заметку
          </button>
          <button type="button" id="cancel-button" class="hidden">
            Отмена
          </button>
        </div>
      </form>
    </section>

    <section>
      <h2 class="section-heading">Мои заметки</h2>

      <form id="search-form" class="actions">
        <input id="search" placeholder="Поиск по заметкам..."
              style="flex: 1; min-width: 180px; margin: 0">
        <button type="submit">Найти</button>
        <button type="button" id="show-favorites">⭐ Избранное</button>
        <button type="button" id="show-all">Все заметки</button>
      </form>


      
      <div id="note-count" class="muted" style="margin: 12px 0"></div>

      
    
    

<div class="tags-panel">
    <h3>Теги</h3>
    <div id="all-tags" class="all-tags"></div>
</div>
<section class="graph-panel">
  <h2>Граф заметок</h2>
  <p class="muted">Связи между заметками на основе созданных отношений.</p>

  <div class="graph-controls">
    <div>
      <label for="graph-start">Начальная заметка</label>
      <select id="graph-start">
        <option value="">Загрузка заметок...</option>
      </select>
    </div>

    <div>
      <label for="graph-depth">Глубина связей</label>
      <select id="graph-depth">
        <option value="1">1 уровень</option>
        <option value="2" selected>2 уровня</option>
        <option value="3">3 уровня</option>
        <option value="4">4 уровня</option>
        <option value="5">5 уровней</option>
      </select>
    </div>

    <button type="button" id="load-graph" class="primary">
      Показать граф
    </button>
  </div>

  <div id="graph-status" class="muted" role="status"></div>
  <div id="graph-canvas">
    <div class="graph-empty">Выбери начальную заметку.</div>
  </div>
</section>



      <div id="notes"></div>

    </section>
  </main>

  <script>
    const form = document.querySelector("#note-form");
    const titleInput = document.querySelector("#title");
    const contentInput = document.querySelector("#content");
    const sourceInput = document.querySelector("#source-url");
    const tagsInput = document.querySelector("#tags");
    const notesContainer = document.querySelector("#notes");
    const errorBox = document.querySelector("#error");

    let editingId = null;

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...options.headers
        }
      });

      if (!response.ok) {
        let message = `Ошибка сервера: ${response.status}`;
        try {
          const data = await response.json();
          message = data.detail || message;
        } catch {}
        throw new Error(
          typeof message === "string" ? message : JSON.stringify(message)
        );
      }

      if (response.status === 204) return null;
      return response.json();
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.add("hidden");
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderNotes(notes) {
      notesContainer.replaceChildren();
      document.querySelector("#note-count").textContent =
        `Заметок: ${notes.length}`;

      if (!notes.length) {
        notesContainer.append(
          makeElement("div", "empty", "Заметок пока нет.")
        );
        return;
      }

      for (const note of notes) {
        const card = makeElement("article", "note");

        const titleRow = makeElement("div", "note-title-row");
        const title = makeElement("h3", "", note.title);

        const favoriteButton = makeElement(
          "button",
          "favorite-button",
          note.is_favorite ? "★" : "☆"
        );

        favoriteButton.type = "button";
        favoriteButton.title = note.is_favorite
          ? "Убрать из избранного"
          : "Добавить в избранное";
        favoriteButton.setAttribute("aria-label", favoriteButton.title);

        if (note.is_favorite) {
          favoriteButton.classList.add("is-favorite");
        }

        favoriteButton.addEventListener("click", () => {
          toggleFavorite(note.id);
        });

        titleRow.append(title, favoriteButton);
        card.append(titleRow);

        
        const date = note.created_at
        ? new Date(note.created_at)
        : null;

        const dateText = date && !Number.isNaN(date.getTime())
        ? date.toLocaleString("ru-RU", {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
            })
        : "Дата неизвестна";

        card.append(makeElement("div", "muted note-date", dateText));

        card.append(makeElement("div", "note-content", note.content));

        if (note.source_url) {
          const source = makeElement("div", "note-source");
          const link = makeElement("a", "", "Открыть источник");
          link.href = note.source_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          source.append(link);
          card.append(source);
        }

        
        if (note.tags?.length) {
        const tags = makeElement("div", "tags");

        for (const name of note.tags) {
            const tagButton = makeElement("button", "tag", name);
            tagButton.type = "button";
            tagButton.title = `Показать заметки с тегом ${name}`;

            tagButton.addEventListener("click", () => {
            filterByTag(name);
            });

            tags.append(tagButton);
        }

        card.append(tags);
        }


        const actions = makeElement("div", "actions note-actions");
        const editButton = makeElement("button", "", "Редактировать");
        editButton.type = "button";
        editButton.addEventListener("click", () => startEditing(note));

        const deleteButton = makeElement("button", "", "Удалить");
        deleteButton.type = "button";
        deleteButton.addEventListener("click", () => deleteNote(note.id));

        actions.append(editButton, deleteButton);
        card.append(actions);
        notesContainer.append(card);
      }
    }

    const graphStartSelect = document.querySelector("#graph-start");
    const graphDepthSelect = document.querySelector("#graph-depth");
    const graphStatus = document.querySelector("#graph-status");
    const graphCanvas = document.querySelector("#graph-canvas");

    async function loadGraphOptions() {
      try {
        const notes = await api("/notes");

        graphStartSelect.replaceChildren();

        if (!notes.length) {
          graphStartSelect.append(
            makeElement("option", "", "Нет заметок")
          );
          graphStartSelect.disabled = true;
          graphStatus.textContent = "Сначала создай заметку.";
          return;
        }

        graphStartSelect.disabled = false;

        for (const note of notes) {
          const option = document.createElement("option");
          option.value = note.id;
          option.textContent = `#${note.id} — ${note.title}`;
          graphStartSelect.append(option);
        }

        graphStatus.textContent =
          `Доступно заметок: ${notes.length}`;
      } catch (error) {
        graphStatus.textContent =
          `Не удалось загрузить заметки: ${error.message}`;
      }
    }

      function renderGraph(graph) {
        graphCanvas.replaceChildren();

        const startOption = graphStartSelect.selectedOptions[0];
        const startTitle = startOption
          ? startOption.textContent
          : `Заметка #${graph.start_note_id}`;

        const nodes = [
          {
            id: graph.start_note_id,
            title: startTitle,
            depth: 0
          },
          ...graph.notes
        ];

        if (graph.relations.length === 0) {
          graphCanvas.append(
            makeElement(
              "div",
              "graph-empty",
              "Связей пока нет. Создай отношение между заметками, чтобы увидеть граф."
            )
          );
          return;
        }

        const width = 720;
        const height = Math.max(300, nodes.length * 100);
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(width * 0.34, height * 0.38);

        const positions = new Map();

        nodes.forEach((node, index) => {
          if (index === 0) {
            positions.set(node.id, { x: centerX, y: centerY });
            return;
          }

          const angle =
            (2 * Math.PI * (index - 1)) / (nodes.length - 1)
            - Math.PI / 2;

          positions.set(node.id, {
            x: centerX + radius * Math.cos(angle),
            y: centerY + radius * Math.sin(angle)
          });
        });

        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", "Граф связанных заметок");

        function svgElement(tag, attributes, text) {
          const element = document.createElementNS(svgNS, tag);

          for (const [name, value] of Object.entries(attributes)) {
            element.setAttribute(name, value);
          }

          if (text !== undefined) {
            element.textContent = text;
          }

          return element;
        }

        const nodeIds = new Set(nodes.map(node => node.id));
      
        for (const relation of graph.relations) {
          if (
            !nodeIds.has(relation.source_note_id) ||
            !nodeIds.has(relation.target_note_id)
          ) {
            continue;
          }

          const source = positions.get(relation.source_note_id);
          const target = positions.get(relation.target_note_id);

          if (!source || !target) continue;

          svg.append(
            svgElement("line", {
              x1: source.x,
              y1: source.y,
              x2: target.x,
              y2: target.y,
              class: "graph-edge"
            })
          );
          
          
          const labelX = (source.x + target.x) / 2;
          const labelY = (source.y + target.y) / 2;

          const dx = target.x - source.x;
          const dy = target.y - source.y;
          const length = Math.hypot(dx, dy) || 1;

          const textX = labelX - (dy / length) * 14;
          const textY = labelY + (dx / length) * 14;

          svg.append(svgElement("text", {
            x: textX,
            y: textY,
            class: "graph-edge-label"
          }, relation.relation_type));


        }

        for (const node of nodes) {
          const position = positions.get(node.id);
          const isStart = node.id === graph.start_note_id;
          const group = svgElement("g", {});
          group.setAttribute("class", "graph-node-group");

          group.style.cursor = "pointer";
          group.setAttribute("role", "button");
          group.setAttribute("tabindex", "0");
          group.setAttribute(
            "aria-label",
            `Открыть граф от заметки: ${node.title}`
          );

          function openFromNode() {
            graphStartSelect.value = String(node.id);
            loadGraph();
          }

          group.addEventListener("click", openFromNode);

          group.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openFromNode();
            }
          });

          group.append(
            svgElement("circle", {
              cx: position.x,
              cy: position.y,
              r: 28,
              class: isStart
                ? "graph-node graph-node-start"
                : "graph-node"
            })
          );

          group.append(
            svgElement("text", {
              x: position.x,
              y: position.y + 4,
              class: isStart
                ? "graph-label graph-label-start"
                : "graph-label"
            }, `#${node.id}`)
          );

          const label =
            node.title.length > 24
              ? `${node.title.slice(0, 21)}...`
              : node.title;

          group.append(
            svgElement("text", {
              x: position.x,
              y: position.y + 46,
              class: "graph-label"
            }, label)
          );

          svg.append(group);
        }

        graphCanvas.append(svg);
      }


    async function loadGraph() {
      const noteId = graphStartSelect.value;
      const depth = graphDepthSelect.value;

      if (!noteId) {
        graphStatus.textContent = "Выбери начальную заметку.";
        return;
      }

      graphStatus.textContent = "Загружаю граф...";
      graphCanvas.replaceChildren();

      try {
        const graph = await api(
          `/notes/${noteId}/graph?depth=${depth}`
        );

        graphStatus.textContent =
          `Найдено связанных заметок: ${graph.notes.length}. ` +
          `Связей: ${graph.relations.length}.`;

        renderGraph(graph);
      } catch (error) {
        graphStatus.textContent =
          `Не удалось загрузить граф: ${error.message}`;
        graphCanvas.replaceChildren(
          makeElement("div", "graph-empty", error.message)
        );
      }
    }

    document.querySelector("#load-graph").addEventListener(
      "click",
      loadGraph
    );

    loadGraphOptions();


    async function loadNotes(path = "/notes") {
      currentView = path;
      clearError();

      try {
        const notes = await api(path);
        renderNotes(notes);
      } catch (error) {
        showError(error.message);
      }
    }

    async function toggleFavorite(noteId) {
      clearError();

      try {
        await api(`/notes/${noteId}/favorite`, {
          method: "PATCH"
        });

        await refreshCurrentView();
      } catch (error) {
        showError(error.message);
      }
    }

    let currentView = "/notes";

    async function refreshCurrentView() {
      await loadNotes(currentView);
      await loadTags();
    }


    
    async function loadTags() {
        const container = document.querySelector("#all-tags");
        container.replaceChildren();

        try {
            const tags = await api("/tags");

            if (!tags.length) {
            container.append(
                makeElement("span", "muted", "Пока нет тегов")
            );
            return;
            }

            for (const tag of tags) {
            const button = makeElement("button", "tag");
            button.type = "button";
            button.dataset.tag = tag.name.toLowerCase();
            button.append(
                document.createTextNode(tag.name + " ")
            );

            const count = makeElement(
                "span",
                "tag-count",
                String(tag.notes_count)
            );

            button.append(count);
            button.title = `Показать заметки с тегом ${tag.name}`;

            button.addEventListener("click", () => {
                filterByTag(tag.name);
            });

            container.append(button);
            }
        } catch (error) {
            showError(`Не удалось загрузить теги: ${error.message}`);
        }
    }

    
    async function filterByTag(tagName) {
    document.querySelector("#search").value = "";
    clearError();

    try {
        const notes = await api(
        `/tags/${encodeURIComponent(tagName)}/notes`
        );
        renderNotes(notes);
        document.querySelector("#note-count").textContent =
        `Тег: ${tagName} · Заметок: ${notes.length}`;
    } catch (error) {
        showError(error.message);
    }
    }


    function resetForm() {
      editingId = null;
      form.reset();
      clearError();
      document.querySelector("#form-heading").textContent = "Новая заметка";
      document.querySelector("#save-button").textContent = "Сохранить заметку";
      document.querySelector("#cancel-button").classList.add("hidden");
    }

    function startEditing(note) {
      editingId = note.id;
      titleInput.value = note.title;
      contentInput.value = note.content;
      sourceInput.value = note.source_url || "";
      tagsInput.value = (note.tags || []).join(", ");

      document.querySelector("#form-heading").textContent =
        "Редактирование заметки";
      document.querySelector("#save-button").textContent = "Сохранить изменения";
      document.querySelector("#cancel-button").classList.remove("hidden");
      clearError();
      window.scrollTo({ top: 0, behavior: "smooth" });
      titleInput.focus();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();

      const payload = {
        title: titleInput.value.trim(),
        content: contentInput.value.trim(),
        source_url: sourceInput.value.trim() || null,
        tags: tagsInput.value
          .split(",")
          .map(tag => tag.trim())
          .filter(Boolean)
      };

      try {
        const path = editingId === null
          ? "/notes"
          : `/notes/${editingId}`;

        await api(path, {
          method: editingId === null ? "POST" : "PUT",
          body: JSON.stringify(payload)
        });

        resetForm();
        await loadNotes();
        await loadTags();
      } catch (error) {
        showError(error.message);
      }
    });

    async function deleteNote(id) {
      if (!confirm("Удалить эту заметку?")) return;

      clearError();
      try {
        await api(`/notes/${id}`, { method: "DELETE" });
        if (editingId === id) resetForm();
        await loadNotes();
        await loadTags();
      } catch (error) {
        showError(error.message);
      }
    }

    document.querySelector("#cancel-button").addEventListener(
      "click", resetForm
    );

    document.querySelector("#search-form").addEventListener(
      "submit", async (event) => {
        event.preventDefault();
        const query = document.querySelector("#search").value.trim();

        if (!query) {
          await loadNotes();
          return;
        }

        await loadNotes(`/notes/search?q=${encodeURIComponent(query)}`);
      }
    );

    document.querySelector("#show-all").addEventListener("click", async () => {
      document.querySelector("#search").value = "";

      await loadNotes("/notes");
      await loadTags();
    });

    document.querySelector("#show-favorites").addEventListener("click", async () => {
      document.querySelector("#search").value = "";

      await loadNotes("/notes/favorites");
      await loadTags();
    });

    loadNotes();
    loadTags();
  </script>
</body>
</html>
